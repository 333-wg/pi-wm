# The gate every push has to clear. It runs exactly what a developer runs locally,
# in the same order, so a green run here means `npm run check && npm test` passes
# on a clean checkout — not just on a machine that happens to have stale build
# output lying around.
#
# Deliberately not here:
#   * `verify:pi-*` — those talk to real model providers with real keys and bill
#     per run, so they stay manual.
#   * the full Playwright suite; a bounded, no-provider core gate runs below.
name: check

on:
  push:
    branches: [main]
  pull_request:

# A newer push replaces an in-flight run for the same ref instead of queueing behind it.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The workspace requires >=22.19.0; 22.x keeps CI on the same major as local.
          node-version: 22
          cache: npm

      - run: npm ci

      # tsc -b for every package, the web app's own program, the e2e program, the
      # test programs (scripts/check-tests.mjs), and the colour-contrast audit.
      - run: npm run check

      # Sandbox unit/integration tests launch a real headless browser too.
      - run: npx playwright install --with-deps chromium

      # Every workspace's vitest suite.
      - run: npm test

      # Isolated demo/loopback providers only; never load saved model credentials.
      - name: Core browser workflows
        run: npm run test:e2e:core

      - name: Retain browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: core-browser-evidence
          path: |
            playwright-report/core/
            test-results/core/
          if-no-files-found: ignore
          retention-days: 14
