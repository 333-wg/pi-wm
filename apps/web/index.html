<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#f7f8f6" />
		<link rel="icon" type="image/png" href="/src/assets/wuming-clover.png" />
		<title>Pi-Wm</title>
		<script>
			// Resolve the stored interface language before React boots so the root
			// document metadata is correct on the first paint as well.
			(function () {
				try {
					var locale = localStorage.getItem("wuming.locale");
					if (locale !== "en") locale = "zh";
					document.documentElement.dataset.locale = locale;
					document.documentElement.lang = locale === "en" ? "en" : "zh-CN";
				} catch (error) {
					document.documentElement.dataset.locale = "zh";
					document.documentElement.lang = "zh-CN";
				}
			})();

			// Mirrors lib/theme.ts; the bootstrap parity test covers every palette.
			(function () {
				var choice = "system", palettes = {};
				try { choice = localStorage.getItem("wuming.theme"); } catch (error) {}
				try { palettes = JSON.parse(localStorage.getItem("wuming.theme.palettes")) || {}; } catch (error) {}
				var dark = typeof matchMedia === "function" && matchMedia("(prefers-color-scheme: dark)").matches;
				var mode = choice === "dark" || choice !== "light" && dark ? "dark" : "light";
				var backgrounds = { light: "#f7f8f6", dark: "#0e120f", white: "#ffffff", paper: "#fbf9f4", "warm-classic": "#f6f0e1", celadon: "#f5f8f5", "ink-night": "#201d17", "ink-blue": "#1a1d24" };
				var allowed = mode === "dark" ? ["dark", "ink-night", "ink-blue"] : ["light", "white", "paper", "warm-classic", "celadon"];
				var palette = allowed.indexOf(palettes[mode]) >= 0 ? palettes[mode] : mode;
				document.documentElement.dataset.theme = palette;
				document.querySelector('meta[name="theme-color"]').setAttribute("content", backgrounds[palette]);
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
